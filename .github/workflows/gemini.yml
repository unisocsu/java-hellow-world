name: Build Gemini CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Compile Java
        run: |
          mkdir -p build/classes
          javac --release 8 -d build/classes GeminiCli.java

      - name: Convert to DEX
        run: |
          mkdir -p build/dex
          "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 19 \
            --output build/dex \
            build/classes/GeminiCli.class

      - name: Create JAR
        run: |
          cd build/dex
          zip ../../GeminiCli-KitKat.jar classes.dex

      - name: Upload GeminiCli
        uses: actions/upload-artifact@v4
        with:
          name: GeminiCli-KitKat
          path: GeminiCli-KitKat.jar
