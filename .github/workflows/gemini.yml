name: Build Gemini CLI for KitKat

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;28.0.3"

      - name: Compile Java 8
        run: |
          mkdir -p build/classes

          javac --release 8 \
            -d build/classes \
            GeminiCli.java

      - name: Convert to KitKat DEX
        run: |
          mkdir -p build/dex

          "$ANDROID_HOME/build-tools/28.0.3/dx" \
            --dex \
            --min-sdk-version=19 \
            --output=build/dex/classes.dex \
            build/classes

      - name: Inspect DEX
        run: |
          ls -lh build/dex/classes.dex
          file build/dex/classes.dex
          unzip -l build/dex/classes.dex || true

      - name: Create JAR
        run: |
          cd build/dex
          zip ../../GeminiCli-KitKat.jar classes.dex

      - name: Upload DEX
        uses: actions/upload-artifact@v4
        with:
          name: GeminiCli-KitKat-DEX
          path: build/dex/classes.dex

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: GeminiCli-KitKat-JAR
          path: GeminiCli-KitKat.jar
