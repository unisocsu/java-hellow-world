name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. משיכת הקוד מהריפוזיטורי
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. הגדרת סביבת Java (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. ביצוע קומפילציה לקובץ ה-Java
    - name: Compile Java file
      run: javac hellow-world.java