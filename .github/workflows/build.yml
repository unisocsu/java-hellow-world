name: Build and Package Java

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. משיכת הקוד
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. הגדרת סביבת Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. קומפילציה לקובץ ה-Java
    - name: Compile Java file
      run: javac hellowworld.java

    # 4. יצירת קובץ JAR להפעלה
    - name: Create JAR file
      run: jar cfe hellowworld.jar hellowworld hellowworld.class

    # 5. העלאת קובץ ה-JAR כאורטיפקט להורדה
    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: runnable-jar
        path: hellowworld.jar